<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>온라인이전 자료 모음</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.css">
<style>
:root{--bg:#f4f5f7;--surface:#fff;--ink:#1f2328;--text:#3d434c;--muted:#7a8089;--line:#e3e6ea;--orange:#ff6f0f;--orange-soft:#fff3ea;--blue:#2f6bff;--blue-soft:#eaf1ff;--green:#157a55;--green-soft:#e6f4ee}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:var(--bg);color:var(--ink);font-family:'Pretendard Variable',Pretendard,-apple-system,'Apple SD Gothic Neo','Malgun Gothic',sans-serif;-webkit-font-smoothing:antialiased;
  display:flex;align-items:center;justify-content:center;padding:48px 16px}
.wrap{width:100%;max-width:1080px}
.logo{height:30px;width:auto;display:block}
h1{margin:22px 0 8px;font-size:clamp(28px,3.4vw,38px);font-weight:800;letter-spacing:-.03em}
.lead{margin:0 0 36px;font-size:16px;color:var(--muted)}
.cards{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:20px}
@media (max-width:860px){.cards{grid-template-columns:1fr}}
.card{position:relative;display:flex;flex-direction:column;gap:12px;padding:28px 26px 24px;background:var(--surface);border:1px solid var(--line);border-radius:18px;text-decoration:none;color:inherit;
  box-shadow:0 1px 2px rgba(16,24,40,.04);transition:transform .15s,box-shadow .15s,border-color .15s}
.card:hover{transform:translateY(-3px);box-shadow:0 14px 34px rgba(16,24,40,.12);border-color:var(--c)}
.card:focus-visible{outline:3px solid var(--c);outline-offset:3px}
.ic{width:52px;height:52px;border-radius:14px;display:grid;place-items:center;background:var(--cs);color:var(--c)}
.ic svg{width:26px;height:26px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.num{position:absolute;top:26px;right:26px;font-size:13px;font-weight:700;color:var(--muted)}
.card h2{margin:6px 0 0;font-size:21px;font-weight:800;letter-spacing:-.02em}
.card p{margin:0;font-size:14.5px;line-height:1.6;color:var(--text);flex:1}
.go{margin-top:8px;font-size:14px;font-weight:700;color:var(--c)}
.c1{--c:var(--orange);--cs:var(--orange-soft)}
.c2{--c:var(--blue);--cs:var(--blue-soft)}
.c3{--c:var(--green);--cs:var(--green-soft)}
</style>
</head>
<body>
<div class="wrap">
  <img class="logo" src="oneprocess_img/logo.png" alt="mobility365">
  <h1>온라인이전 자료 모음</h1>
  <p class="lead">보고 싶은 자료를 선택하세요.</p>

  <div class="cards">
    <a class="card c1" href="./mockup.html">
      <span class="num">01</span>
      <span class="ic"><svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="13" rx="2"/><path d="M8 21h8M12 17v4"/></svg></span>
      <h2>제시매도 온라인이전 목업</h2>
      <p>제시매도 전자계약 화면에서 [이전신청]을 눌러 온라인이전 대시보드로 들어가는 화면입니다.</p>
      <span class="go">목업 보기 →</span>
    </a>
    <a class="card c2" href="./Aton_온라인이전_사용매뉴얼.html">
      <span class="num">02</span>
      <span class="ic"><svg viewBox="0 0 24 24"><path d="M4 5.5A2.5 2.5 0 0 1 6.5 3H20v15H6.5A2.5 2.5 0 0 0 4 20.5z"/><path d="M4 20.5A2.5 2.5 0 0 0 6.5 23H20v-5"/></svg></span>
      <h2>온라인이전 사용매뉴얼</h2>
      <p>서비스 가입신청부터 전자계약 · 종이계약 온라인이전 신청 방법과 진행상태를 안내합니다.</p>
      <span class="go">매뉴얼 보기 →</span>
    </a>
    <a class="card c3" href="./oneprocess.html">
      <span class="num">03</span>
      <span class="ic"><svg viewBox="0 0 24 24"><circle cx="5" cy="12" r="2"/><circle cx="12" cy="12" r="2"/><circle cx="19" cy="12" r="2"/><path d="M7 12h3M14 12h3"/></svg></span>
      <h2>원프로세스 프로토타입</h2>
      <p>할부, 보험, 전자계약부터 온라인 이전까지 하나로 이어지는 흐름을 단계별로 보여줍니다.</p>
      <span class="go">프로토타입 보기 →</span>
    </a>
  </div>
</div>
</body>
</html>
