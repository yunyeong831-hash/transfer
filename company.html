<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>모빌리티365 회사 소개</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.css">
<style>
:root{--bg:#f4f5f7;--ink:#1f2328;--muted:#7a8089;--line:#e3e6ea;--orange:#ff6f0f;color-scheme:light}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'Pretendard Variable',Pretendard,-apple-system,'Apple SD Gothic Neo','Malgun Gothic',sans-serif;-webkit-font-smoothing:antialiased}
header{position:sticky;top:0;z-index:5;background:rgba(244,245,247,.92);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.bar{max-width:1240px;margin:0 auto;padding:14px 16px;display:flex;align-items:center;gap:14px}
.bar img{height:22px;display:block}
.bar h1{margin:0;font-size:17px;font-weight:800;letter-spacing:-.02em}
.bar .back{margin-left:auto;font-size:14px;font-weight:700;color:var(--muted);text-decoration:none}
.bar .back:hover{color:var(--orange)}
main{max-width:1240px;margin:0 auto;padding:24px 16px 56px;display:flex;flex-direction:column;gap:20px}
.pg{background:#fff;border-radius:12px;overflow:hidden;box-shadow:0 2px 10px rgba(16,24,40,.08);aspect-ratio:16/9}
.pg img{width:100%;height:100%;display:block;-webkit-user-drag:none;user-select:none;-webkit-touch-callout:none}
@media (max-width:600px){main{gap:12px;padding-top:16px}.pg{border-radius:8px}}
</style>
</head>
<body>
<header><div class="bar">
  <img src="oneprocess_img/logo.png" alt="mobility365">
  <h1>회사 소개</h1>
  <a class="back" href="./index.html">← 처음으로</a>
</div></header>
<main id="pages"></main>
<script>
var N=8, m=document.getElementById('pages');
for(var i=1;i<=N;i++){var d=document.createElement('div');d.className='pg';var im=document.createElement('img');
im.src='company_img/p'+(i<10?'0':'')+i+'.jpg';im.alt='회사 소개 '+i+'쪽';im.loading=i>2?'lazy':'eager';im.draggable=false;d.appendChild(im);m.appendChild(d);}
m.addEventListener('contextmenu',function(e){if(e.target.tagName==='IMG')e.preventDefault();});
</script>
</body>
</html>
